<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Completed binary search tree" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="980" height="610" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="23" font-weight="600" fill="#1B2430">Completed binary search tree</text>
  <text x="34" y="66" font-size="14.5" fill="#5B6B7C">Built from 55, 27, 82, 19, 41, 70, 96, 27, 63, 88, 82, 12 — inserted in array order, duplicates rejected.</text>
  <rect x="52" y="188" width="316" height="280" rx="12" fill="#E0F2FE" opacity="0.8"/>
  <rect x="416" y="188" width="316" height="280" rx="12" fill="#FCE7F3" opacity="0.8"/>
  <text x="210" y="454" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0369A1">left subtree — every value &lt; 55</text>
  <text x="574" y="454" font-size="13.5" font-weight="600" text-anchor="middle" fill="#9D174D">right subtree — every value &gt; 55</text>
  <line x1="410" y1="136" x2="232" y2="226" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="410" y1="136" x2="592" y2="226" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="232" y1="226" x2="146" y2="316" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="232" y1="226" x2="322" y2="316" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="592" y1="226" x2="502" y2="316" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="592" y1="226" x2="682" y2="316" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="146" y1="316" x2="86" y2="406" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="502" y1="316" x2="448" y2="406" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="682" y1="316" x2="628" y2="406" stroke="#C3CEDA" stroke-width="2"/>
  <circle cx="410" cy="136" r="27" fill="#F59E0B" stroke="#1B2430" stroke-width="2"/>
  <text x="410" y="142" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">55</text>
  <circle cx="232" cy="226" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="232" y="232" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">27</text>
  <circle cx="592" cy="226" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="592" y="232" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">82</text>
  <circle cx="146" cy="316" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="146" y="322" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">19</text>
  <circle cx="322" cy="316" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="322" y="322" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">41</text>
  <circle cx="502" cy="316" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="502" y="322" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">70</text>
  <circle cx="682" cy="316" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="682" y="322" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">96</text>
  <circle cx="86" cy="406" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="86" y="412" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">12</text>
  <circle cx="448" cy="406" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="448" y="412" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">63</text>
  <circle cx="628" cy="406" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="628" y="412" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">88</text>
  <text x="410" y="94" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1B2430">root</text>
  <line x1="410" y1="100" x2="410" y2="108" stroke="#1B2430" stroke-width="1.5"/>
  <rect x="770" y="188" width="176" height="104" rx="6" fill="#FEF2F2" stroke="#F2C9C9"/>
  <text x="786" y="216" font-size="12.5" font-weight="600" fill="#B91C1C">discarded as duplicates</text>
  <text x="786" y="242" font-size="13" fill="#5B6B7C">the second 27</text>
  <text x="786" y="262" font-size="13" fill="#5B6B7C">the second 82</text>
  <text x="786" y="282" font-size="12.5" fill="#5B6B7C">10 of 12 inserted</text>
  <circle cx="62" cy="498" r="10" fill="#F59E0B" stroke="#1B2430" stroke-width="1.5"/>
  <text x="80" y="503" font-size="13" fill="#5B6B7C">root</text>
  <circle cx="162" cy="498" r="10" fill="#A7F3D0" stroke="#1B2430" stroke-width="1.5"/>
  <text x="180" y="503" font-size="13" fill="#5B6B7C">leaves: 12, 41, 63, 88</text>
  <text x="34" y="540" font-size="14" fill="#5B6B7C">The BST rule holds at every node, not just the root. That is what makes lookup O(log n) in a balanced tree.</text>
  <text x="34" y="561" font-size="14" fill="#5B6B7C">predecessor(55) = 41, the rightmost node of the left subtree. successor(55) = 63, the leftmost node of the right subtree.</text>
</svg>
