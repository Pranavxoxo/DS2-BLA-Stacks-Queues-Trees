<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Circular queue: wrapping from the last slot back to slot 0" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="980" height="660" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="23" font-weight="600" fill="#1B2430">Circular queue: wrapping from the last slot back to slot 0</text>
  <text x="34" y="66" font-size="14.5" fill="#5B6B7C">State taken from CircularQueue.cpp after the wrap: start = 2, end = 1, count = 5.</text>
  <circle cx="400" cy="358" r="175" fill="none" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="3 5"/>
  <path d="M 249.6 259.9 Q 296.8 127.0 350.0 169.0" stroke="#0F766E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="300.8" y="119.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#0F766E">(4 + 1) % 5 = 0</text>
  <circle cx="400.0" cy="183.0" r="48" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.8"/>
  <text x="400.0" y="185.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1B2430">60</text>
  <text x="400.0" y="206.0" font-size="12" text-anchor="middle" fill="#5B6B7C">index 0</text>
  <circle cx="566.4" cy="303.9" r="48" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3"/>
  <text x="566.4" y="305.9" font-size="22" font-weight="600" text-anchor="middle" fill="#1B2430">70</text>
  <text x="566.4" y="326.9" font-size="12" text-anchor="middle" fill="#5B6B7C">index 1</text>
  <circle cx="502.9" cy="499.6" r="48" fill="#D1FAE5" stroke="#0F766E" stroke-width="3"/>
  <text x="502.9" y="501.6" font-size="22" font-weight="600" text-anchor="middle" fill="#1B2430">30</text>
  <text x="502.9" y="522.6" font-size="12" text-anchor="middle" fill="#5B6B7C">index 2</text>
  <circle cx="297.1" cy="499.6" r="48" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.8"/>
  <text x="297.1" y="501.6" font-size="22" font-weight="600" text-anchor="middle" fill="#1B2430">40</text>
  <text x="297.1" y="522.6" font-size="12" text-anchor="middle" fill="#5B6B7C">index 3</text>
  <circle cx="233.6" cy="303.9" r="48" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.8"/>
  <text x="233.6" y="305.9" font-size="22" font-weight="600" text-anchor="middle" fill="#1B2430">50</text>
  <text x="233.6" y="326.9" font-size="12" text-anchor="middle" fill="#5B6B7C">index 4</text>
  <text x="502.9" y="573.6" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0F766E">start / front</text>
  <text x="628.4" y="308.9" font-size="13.5" font-weight="600" fill="#B91C1C">end / rear</text>
  <text x="400" y="342" font-size="13.5" text-anchor="middle" fill="#5B6B7C">front &#8594; rear</text>
  <text x="400" y="368" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">30, 40, 50, 60, 70</text>
  <text x="400" y="390" font-size="13" text-anchor="middle" fill="#5B6B7C">count = 5</text>
  <rect x="726" y="180" width="220" height="158" rx="6" fill="#F8FAFC" stroke="#C3CEDA"/>
  <text x="746" y="208" font-size="14" font-weight="600" fill="#1B2430">The whole trick</text>
  <text x="746" y="236" font-size="12.5" fill="#0F766E">end   = (end + 1) % SIZE;</text>
  <text x="746" y="258" font-size="12.5" fill="#0F766E">start = (start + 1) % SIZE;</text>
  <text x="746" y="288" font-size="12.5" fill="#5B6B7C">Freed slots get reused,</text>
  <text x="746" y="307" font-size="12.5" fill="#5B6B7C">nothing shifts, and both</text>
  <text x="746" y="326" font-size="12.5" fill="#5B6B7C">operations stay O(1).</text>
  <text x="34" y="596" font-size="14" fill="#5B6B7C">60 was enqueued after the rear had already reached index 4, so it landed in slot 0 — a slot an earlier dequeue had freed.</text>
  <text x="34" y="617" font-size="14" fill="#5B6B7C">The rear is now at a lower index than the front, which is why displayAll() steps count times from start instead of looping start to end.</text>
</svg>
