<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Preorder traversal: ROOT → LEFT → RIGHT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="980" height="580" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="23" font-weight="600" fill="#1B2430">Preorder traversal: ROOT → LEFT → RIGHT</text>
  <text x="34" y="66" font-size="14.5" fill="#5B6B7C">Each node is printed the moment you arrive at it, before either child is explored.</text>
  <line x1="410" y1="118" x2="232" y2="208" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="410" y1="118" x2="592" y2="208" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="232" y1="208" x2="146" y2="298" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="232" y1="208" x2="322" y2="298" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="592" y1="208" x2="502" y2="298" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="592" y1="208" x2="682" y2="298" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="146" y1="298" x2="86" y2="388" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="502" y1="298" x2="448" y2="388" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="682" y1="298" x2="628" y2="388" stroke="#C3CEDA" stroke-width="2"/>
  <circle cx="410" cy="118" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="410" y="124" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">55</text>
  <circle cx="232" cy="208" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="232" y="214" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">27</text>
  <circle cx="592" cy="208" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="592" y="214" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">82</text>
  <circle cx="146" cy="298" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="146" y="304" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">19</text>
  <circle cx="322" cy="298" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="322" y="304" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">41</text>
  <circle cx="502" cy="298" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="502" y="304" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">70</text>
  <circle cx="682" cy="298" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="682" y="304" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">96</text>
  <circle cx="86" cy="388" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="86" y="394" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">12</text>
  <circle cx="448" cy="388" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="448" y="394" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">63</text>
  <circle cx="628" cy="388" r="27" fill="#F8FAFC" stroke="#1B2430" stroke-width="2"/>
  <text x="628" y="394" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">88</text>
  <circle cx="436" cy="93" r="14" fill="#1D4ED8"/>
  <text x="436" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="258" cy="183" r="14" fill="#1D4ED8"/>
  <text x="258" y="188" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="172" cy="273" r="14" fill="#1D4ED8"/>
  <text x="172" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <circle cx="112" cy="363" r="14" fill="#1D4ED8"/>
  <text x="112" y="368" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <circle cx="348" cy="273" r="14" fill="#1D4ED8"/>
  <text x="348" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <circle cx="618" cy="183" r="14" fill="#1D4ED8"/>
  <text x="618" y="188" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <circle cx="528" cy="273" r="14" fill="#1D4ED8"/>
  <text x="528" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">7</text>
  <circle cx="474" cy="363" r="14" fill="#1D4ED8"/>
  <text x="474" y="368" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">8</text>
  <circle cx="708" cy="273" r="14" fill="#1D4ED8"/>
  <text x="708" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">9</text>
  <circle cx="654" cy="363" r="14" fill="#1D4ED8"/>
  <text x="654" y="368" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">10</text>
  <text x="34" y="472" font-size="14" font-weight="600" fill="#1B2430">Visit order</text>
  <text x="34" y="498" font-size="18" font-weight="600" fill="#1D4ED8">55, 27, 19, 12, 41, 82, 70, 63, 96, 88</text>
  <text x="34" y="528" font-size="14" fill="#5B6B7C">The root comes out first and each parent precedes its whole subtree.</text>
  <text x="34" y="549" font-size="14" fill="#5B6B7C">Re-inserting the values in this order rebuilds an identical tree, which is why preorder serialises or copies a tree.</text>
</svg>
