<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Queue: enqueue and dequeue" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="23" font-weight="600" fill="#1B2430">Queue: enqueue and dequeue</text>
  <text x="34" y="66" font-size="14.5" fill="#5B6B7C">Items join at the rear and leave from the front — FIFO. The same array at two moments in time.</text>
  <text x="34" y="124" font-size="14.5" font-weight="600" fill="#1B2430">Normal operation: three items waiting</text>
  <rect x="170" y="170" width="104" height="62" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="222.0" y="209" font-size="19" font-weight="600" text-anchor="middle" fill="#1B2430">10</text>
  <text x="222.0" y="251" font-size="12" text-anchor="middle" fill="#5B6B7C">index 0</text>
  <rect x="274" y="170" width="104" height="62" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="326.0" y="209" font-size="19" font-weight="600" text-anchor="middle" fill="#1B2430">20</text>
  <text x="326.0" y="251" font-size="12" text-anchor="middle" fill="#5B6B7C">index 1</text>
  <rect x="378" y="170" width="104" height="62" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="430.0" y="209" font-size="19" font-weight="600" text-anchor="middle" fill="#1B2430">30</text>
  <text x="430.0" y="251" font-size="12" text-anchor="middle" fill="#5B6B7C">index 2</text>
  <rect x="482" y="170" width="104" height="62" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="534.0" y="251" font-size="12" text-anchor="middle" fill="#5B6B7C">index 3</text>
  <rect x="586" y="170" width="104" height="62" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="638.0" y="251" font-size="12" text-anchor="middle" fill="#5B6B7C">index 4</text>
  <text x="222.0" y="156" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0F766E">start / front</text>
  <text x="430.0" y="156" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B91C1C">end / rear</text>
  <path d="M 150 201 L 46 201" stroke="#B91C1C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="98" y="190" font-size="13" font-weight="600" text-anchor="middle" fill="#B91C1C">dequeue()</text>
  <text x="98" y="222" font-size="12.5" text-anchor="middle" fill="#5B6B7C">returns 10</text>
  <path d="M 900 201 L 706 201" stroke="#0F766E" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="806" y="190" font-size="13" font-weight="600" text-anchor="middle" fill="#0F766E">enqueue(40)</text>
  <text x="806" y="222" font-size="12.5" text-anchor="middle" fill="#5B6B7C">lands in index 3</text>
  <text x="34" y="324" font-size="14.5" font-weight="600" fill="#1B2430">Later: the queue filled up, then two items left</text>
  <rect x="170" y="370" width="104" height="62" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="222.0" y="451" font-size="12" text-anchor="middle" fill="#5B6B7C">index 0</text>
  <rect x="274" y="370" width="104" height="62" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="326.0" y="451" font-size="12" text-anchor="middle" fill="#5B6B7C">index 1</text>
  <rect x="378" y="370" width="104" height="62" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="430.0" y="409" font-size="19" font-weight="600" text-anchor="middle" fill="#1B2430">30</text>
  <text x="430.0" y="451" font-size="12" text-anchor="middle" fill="#5B6B7C">index 2</text>
  <rect x="482" y="370" width="104" height="62" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="534.0" y="409" font-size="19" font-weight="600" text-anchor="middle" fill="#1B2430">40</text>
  <text x="534.0" y="451" font-size="12" text-anchor="middle" fill="#5B6B7C">index 3</text>
  <rect x="586" y="370" width="104" height="62" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="638.0" y="409" font-size="19" font-weight="600" text-anchor="middle" fill="#1B2430">50</text>
  <text x="638.0" y="451" font-size="12" text-anchor="middle" fill="#5B6B7C">index 4</text>
  <text x="430.0" y="356" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0F766E">start / front</text>
  <text x="638.0" y="356" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B91C1C">end / rear</text>
  <rect x="170" y="370" width="208" height="62" fill="none" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="274" y="356" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B91C1C">free, but unreachable</text>
  <path d="M 900 401 L 706 401" stroke="#C3CEDA" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="806" y="390" font-size="13" font-weight="600" text-anchor="middle" fill="#5B6B7C">enqueue(60)</text>
  <text x="806" y="422" font-size="12.5" text-anchor="middle" fill="#B91C1C">refused</text>
  <text x="34" y="496" font-size="14" fill="#5B6B7C">The second row is FALSE OVERFLOW: end has reached the last index and can only move forward, so the queue calls itself full</text>
  <text x="34" y="517" font-size="14" fill="#5B6B7C">while 40% of the array sits empty. Shifting everything down would fix it, but that turns an O(1) operation into O(n).</text>
</svg>
