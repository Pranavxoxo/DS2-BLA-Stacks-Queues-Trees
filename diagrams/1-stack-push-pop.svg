<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Stack: push and pop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="23" font-weight="600" fill="#1B2430">Stack: push and pop</text>
  <text x="34" y="66" font-size="14.5" fill="#5B6B7C">Static array of capacity 5. Only the top slot is reachable, and that single restriction is what makes the structure LIFO.</text>
  <text x="126.0" y="132" font-size="15" font-weight="600" text-anchor="middle" fill="#1B2430">Initial state</text>
  <text x="126.0" y="153" font-size="13.5" text-anchor="middle" fill="#5B6B7C">top = 2</text>
  <rect x="70" y="430" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="126.0" y="456" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">11</text>
  <text x="58" y="456" font-size="12.5" text-anchor="end" fill="#5B6B7C">0</text>
  <rect x="70" y="384" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="126.0" y="410" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">22</text>
  <text x="58" y="410" font-size="12.5" text-anchor="end" fill="#5B6B7C">1</text>
  <rect x="70" y="338" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="126.0" y="364" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">33</text>
  <text x="58" y="364" font-size="12.5" text-anchor="end" fill="#5B6B7C">2</text>
  <rect x="70" y="292" width="112" height="40" rx="4" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="58" y="318" font-size="12.5" text-anchor="end" fill="#5B6B7C">3</text>
  <rect x="70" y="246" width="112" height="40" rx="4" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="58" y="272" font-size="12.5" text-anchor="end" fill="#5B6B7C">4</text>
  <text x="192" y="364" font-size="13" font-weight="600" fill="#0F766E">&#8592; top</text>
  <text x="456.0" y="132" font-size="15" font-weight="600" text-anchor="middle" fill="#1B2430">After push(44)</text>
  <text x="456.0" y="153" font-size="13.5" text-anchor="middle" fill="#5B6B7C">top = 3</text>
  <rect x="400" y="430" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="456.0" y="456" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">11</text>
  <text x="388" y="456" font-size="12.5" text-anchor="end" fill="#5B6B7C">0</text>
  <rect x="400" y="384" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="456.0" y="410" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">22</text>
  <text x="388" y="410" font-size="12.5" text-anchor="end" fill="#5B6B7C">1</text>
  <rect x="400" y="338" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="456.0" y="364" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">33</text>
  <text x="388" y="364" font-size="12.5" text-anchor="end" fill="#5B6B7C">2</text>
  <rect x="400" y="292" width="112" height="40" rx="4" fill="#FEF3C7" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="456.0" y="318" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">44</text>
  <text x="388" y="318" font-size="12.5" text-anchor="end" fill="#5B6B7C">3</text>
  <rect x="400" y="246" width="112" height="40" rx="4" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="388" y="272" font-size="12.5" text-anchor="end" fill="#5B6B7C">4</text>
  <text x="522" y="318" font-size="13" font-weight="600" fill="#0F766E">&#8592; top</text>
  <text x="786.0" y="132" font-size="15" font-weight="600" text-anchor="middle" fill="#1B2430">After pop()</text>
  <text x="786.0" y="153" font-size="13.5" text-anchor="middle" fill="#5B6B7C">top = 2</text>
  <rect x="730" y="430" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="786.0" y="456" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">11</text>
  <text x="718" y="456" font-size="12.5" text-anchor="end" fill="#5B6B7C">0</text>
  <rect x="730" y="384" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="786.0" y="410" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">22</text>
  <text x="718" y="410" font-size="12.5" text-anchor="end" fill="#5B6B7C">1</text>
  <rect x="730" y="338" width="112" height="40" rx="4" fill="#F1F5F9" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="786.0" y="364" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">33</text>
  <text x="718" y="364" font-size="12.5" text-anchor="end" fill="#5B6B7C">2</text>
  <rect x="730" y="292" width="112" height="40" rx="4" fill="#EEF2F6" stroke="#C3CEDA" stroke-width="1.5"/>
  <text x="786.0" y="318" font-size="16" text-anchor="middle" fill="#AEBAC6" font-style="italic">44</text>
  <text x="718" y="318" font-size="12.5" text-anchor="end" fill="#5B6B7C">3</text>
  <rect x="730" y="246" width="112" height="40" rx="4" fill="#FFFFFF" stroke="#C3CEDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="718" y="272" font-size="12.5" text-anchor="end" fill="#5B6B7C">4</text>
  <text x="852" y="364" font-size="13" font-weight="600" fill="#1B2430">&#8592; top</text>
  <path d="M 240 224 L 380 224" stroke="#0F766E" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="212" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0F766E">push(44)</text>
  <text x="310" y="246" font-size="12.5" text-anchor="middle" fill="#5B6B7C">top++, then write</text>
  <path d="M 570 224 L 710 224" stroke="#B91C1C" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="640" y="212" font-size="14.5" font-weight="600" text-anchor="middle" fill="#B91C1C">pop() returns 44</text>
  <text x="640" y="246" font-size="12.5" text-anchor="middle" fill="#5B6B7C">read, then top--</text>
  <text x="856" y="312" font-size="11.5" fill="#AEBAC6">still in memory,</text>
  <text x="856" y="327" font-size="11.5" fill="#AEBAC6">logically gone</text>
  <text x="34" y="496" font-size="14" fill="#5B6B7C">44 was pushed last and popped first: both operations go through the same single opening, so the ordering falls out of the shape.</text>
  <text x="34" y="517" font-size="14" fill="#5B6B7C">pop() never erases the slot; it only moves the top marker down, so the next push overwrites it. Both operations are O(1).</text>
</svg>
