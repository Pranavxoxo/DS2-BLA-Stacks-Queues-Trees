<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Binary tree terminology" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#FFFFFF"/>
  <text x="34" y="42" font-size="23" font-weight="600" fill="#1B2430">Binary tree terminology</text>
  <text x="34" y="66" font-size="14.5" fill="#5B6B7C">Every node holds a value and two pointers. A pointer that is nullptr means that subtree does not exist.</text>
  <rect x="46" y="210" width="316" height="250" rx="10" fill="none" stroke="#7C9CB8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="46" y="200" font-size="13" font-weight="600" fill="#4A7593">left subtree of the root</text>
  <rect x="452" y="210" width="290" height="250" rx="10" fill="none" stroke="#B08099" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="452" y="200" font-size="13" font-weight="600" fill="#96566F">right subtree of the root</text>
  <line x1="410" y1="152" x2="232" y2="242" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="410" y1="152" x2="592" y2="242" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="232" y1="242" x2="146" y2="332" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="232" y1="242" x2="322" y2="332" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="592" y1="242" x2="502" y2="332" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="592" y1="242" x2="682" y2="332" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="146" y1="332" x2="86" y2="422" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="502" y1="332" x2="448" y2="422" stroke="#C3CEDA" stroke-width="2"/>
  <line x1="682" y1="332" x2="628" y2="422" stroke="#C3CEDA" stroke-width="2"/>
  <circle cx="410" cy="152" r="27" fill="#FEF3C7" stroke="#1B2430" stroke-width="2"/>
  <text x="410" y="158" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">55</text>
  <circle cx="232" cy="242" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="232" y="248" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">27</text>
  <circle cx="592" cy="242" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="592" y="248" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">82</text>
  <circle cx="146" cy="332" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="146" y="338" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">19</text>
  <circle cx="322" cy="332" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="322" y="338" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">41</text>
  <circle cx="502" cy="332" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="502" y="338" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">70</text>
  <circle cx="682" cy="332" r="27" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
  <text x="682" y="338" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">96</text>
  <circle cx="86" cy="422" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="86" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">12</text>
  <circle cx="448" cy="422" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="448" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">63</text>
  <circle cx="628" cy="422" r="27" fill="#A7F3D0" stroke="#1B2430" stroke-width="2"/>
  <text x="628" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#1B2430">88</text>
  <line x1="302" y1="150" x2="382" y2="150" stroke="#5B6B7C" stroke-width="1.2"/>
  <text x="298" y="154" font-size="13" font-weight="600" text-anchor="end" fill="#5B6B7C">root — the one node with no parent</text>
  <line x1="244" y1="206" x2="238" y2="216" stroke="#5B6B7C" stroke-width="1.2"/>
  <text x="248" y="200" font-size="13" font-weight="600" fill="#5B6B7C">parent of 19 and 41</text>
  <line x1="116" y1="300" x2="134" y2="310" stroke="#5B6B7C" stroke-width="1.2"/>
  <text x="112" y="296" font-size="13" font-weight="600" text-anchor="end" fill="#5B6B7C">left child</text>
  <line x1="354" y1="300" x2="336" y2="310" stroke="#5B6B7C" stroke-width="1.2"/>
  <text x="358" y="296" font-size="13" font-weight="600" fill="#5B6B7C">right child</text>
  <line x1="86" y1="462" x2="86" y2="478" stroke="#5B6B7C" stroke-width="1.2"/>
  <text x="36" y="496" font-size="13" font-weight="600" fill="#5B6B7C">leaf — both pointers are nullptr</text>
  <line x1="322" y1="362" x2="322" y2="478" stroke="#5B6B7C" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="322" y="496" font-size="13" font-weight="600" text-anchor="middle" fill="#5B6B7C">also a leaf</text>
  <text x="756" y="252" font-size="13" font-weight="600" fill="#5B6B7C">a subtree is</text>
  <text x="756" y="272" font-size="12.5" fill="#5B6B7C">a tree in its own</text>
  <text x="756" y="290" font-size="12.5" fill="#5B6B7C">right, which is why</text>
  <text x="756" y="308" font-size="12.5" fill="#5B6B7C">every method in the</text>
  <text x="756" y="326" font-size="12.5" fill="#5B6B7C">class can recurse</text>
  <text x="756" y="344" font-size="12.5" fill="#5B6B7C">on it</text>
  <text x="34" y="540" font-size="14" fill="#5B6B7C">A binary tree is only a shape: at most two children per node, with no rule about which value goes where.</text>
  <text x="34" y="561" font-size="14" fill="#5B6B7C">predecessor(41) = 27 and successor(41) = 55 — the neighbours of 41 in the sorted (inorder) sequence.</text>
</svg>
